name: Automated Green Squares

on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC (Morning)
    - cron: '0 12 * * *'   # 12:00 UTC (Afternoon)
    - cron: '45 15 * * *'  # 15:45 UTC (Evening)
  workflow_dispatch:       # Allows manual triggering from the GitHub Actions tab

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Git Identity
        run: |
          git config --global user.name "TANISHRAI01"
          git config --global user.email "TANISHRAI01@users.noreply.github.com"

      - name: Run commit generator script
        run: python commit.py

      - name: Push commits
        run: |
          git pull --rebase
          git push origin main
